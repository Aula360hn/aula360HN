    <!-- EARLY SPLASH KILLER: runs immediately, no external dependencies -->
    <script>
        (function() {
            var pctEl = document.getElementById('splash-pct');
            var start = null;
            function tick(ts) {
                if (!start) start = ts;
                var p = Math.min(100, ((ts - start) / 1000) * 100);
                if (pctEl) pctEl.textContent = Math.round(p) + '%';
                if (p < 100) {
                    requestAnimationFrame(tick);
                } else {
                    var s = document.getElementById('gdhn-splash');
                    if (s) {
                        s.style.transition = 'opacity 0.4s ease';
                        s.style.opacity = '0';
                        setTimeout(function() { s.style.display = 'none'; }, 400);
                    }
                }
            }
            requestAnimationFrame(tick);
            setTimeout(function() {
                var s = document.getElementById('gdhn-splash');
                if (s && s.style.display !== 'none') {
                    s.style.transition = 'opacity 0.3s ease';
                    s.style.opacity = '0';
                    setTimeout(function() { s.style.display = 'none'; }, 300);
                }
            }, 2000);
        })();
    </script>

    <!-- SPLASH KILLER: Runs independently of any other JS errors -->
    <script>
        (function () {
            function hideSplash() {
                var s = document.getElementById('gdhn-splash');
                if (!s) return;
                s.style.transition = 'opacity 0.5s';
                s.style.opacity = '0';
                setTimeout(function () { s.style.display = 'none'; }, 500);
            }
            // Animate the progress bar independently
            var pct = 0;
            var arc = null, pctEl = null;
            var CIRCUM = 2 * Math.PI * 54;
            function getEls() {
                arc = document.getElementById('splash-arc');
                pctEl = document.getElementById('splash-pct');
            }
            var start = null;
            function animFrame(ts) {
                if (!start) start = ts;
                if (!arc) getEls();
                var elapsed = ts - start;
                var p = Math.min(100, (elapsed / 1200) * 100);
                if (pctEl) pctEl.textContent = Math.round(p) + '%';
                if (arc) arc.style.strokeDashoffset = CIRCUM - (p / 100) * CIRCUM;
                if (p <100) {
                    requestAnimationFrame(animFrame);
                } else {
                    setTimeout(hideSplash, 300);
                }
            }
            // Start as soon as DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', function () {
                    requestAnimationFrame(animFrame);
                });
            } else {
                requestAnimationFrame(animFrame);
            }
            // ABSOLUTE emergency: force hide after 4 seconds no matter what
            setTimeout(hideSplash, 4000);
        })();

    </script>

    <!-- ============================================================
         ANDROID KEYBOARD MANAGER
         1) Al hacer SCROLL en cualquier dirección → cierra el teclado
         2) Al hacer FOCUS en un campo → desplaza el campo al centro
            del espacio visible sobre el teclado
         ============================================================ -->
    <script>
        (function () {
            // Solo actúa en Android nativo (Capacitor WebView)
            if (!/Android/i.test(navigator.userAgent)) return;

            var lastFocused  = null;
            var touchStartY  = 0;
            var touchStartX  = 0;
            var SCROLL_THRESHOLD = 8; // px mínimos para considerar scroll intencional

            /* ── Helpers ─────────────────────────────────────────── */
            function dismissKeyboard() {
                var active = document.activeElement;
                if (active && (
                    active.tagName === 'INPUT'    ||
                    active.tagName === 'TEXTAREA' ||
                    active.tagName === 'SELECT'
                )) {
                    active.blur();
                }
            }

            function scrollFieldIntoView(el) {
                if (!el) return;
                // Espera ~320 ms a que el teclado termine de abrirse
                setTimeout(function () {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 320);
            }

            /* ── 1. Dismiss al hacer scroll táctil ───────────────── */
            document.addEventListener('touchstart', function (e) {
                touchStartY = e.touches[0].clientY;
                touchStartX = e.touches[0].clientX;
            }, { passive: true, capture: true });

            document.addEventListener('touchmove', function (e) {
                var dy = Math.abs(e.touches[0].clientY - touchStartY);
                var dx = Math.abs(e.touches[0].clientX - touchStartX);
                // Solo actúa si el movimiento supera el umbral (evita micro-toques)
                if (dy > SCROLL_THRESHOLD || dx > SCROLL_THRESHOLD) {
                    dismissKeyboard();
                }
            }, { passive: true, capture: true });

            /* ── 2. Scroll-to-center al enfocar un campo ─────────── */
            document.addEventListener('focus', function (e) {
                var tag = e.target && e.target.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
                    lastFocused = e.target;
                    scrollFieldIntoView(e.target);
                }
            }, true);

            // Re-centra si el viewport cambia de tamaño (teclado abre/cierra)
            window.addEventListener('resize', function () {
                if (lastFocused && document.activeElement === lastFocused) {
                    scrollFieldIntoView(lastFocused);
                }
            });
        })();
    </script>
    <!-- Carga diferida de librerías pesadas (Excel/PDF) para acelerar el arranque -->
    <script>
        (function() {
            var loaded = {};
            var LIBS = {
                xlsx: 'xlsx.full.min.js?v=2026.09.29.01',
                html2pdf: 'html2pdf.bundle.min.js',
                pdfjs: 'pdf.min.js'
            };
            function loadScript(key) {
                if (loaded[key]) return loaded[key];
                loaded[key] = new Promise(function(resolve) {
                    var s = document.createElement('script');
                    s.src = LIBS[key];
                    s.async = true;
                    s.onload = function() {
                        if (key === 'pdfjs') {
                            var p = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
                            if (p && p.GlobalWorkerOptions) p.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
                        }
                        resolve(true);
                    };
                    s.onerror = function() { resolve(false); };
                    document.body.appendChild(s);
                });
                return loaded[key];
            }
            window.Aula360Libs = {
                ensure: function(key) { return LIBS[key] ? loadScript(key) : Promise.resolve(false); },
                preloadAll: function() { return Promise.all(['xlsx', 'html2pdf', 'pdfjs'].map(loadScript)); }
            };
            window.addEventListener('load', function() {
                if (typeof requestIdleCallback === 'function') {
                    requestIdleCallback(function() { window.Aula360Libs.preloadAll(); }, { timeout: 500 });
                } else {
                    setTimeout(function() { window.Aula360Libs.preloadAll(); }, 250);
                }
            });
        })();
    </script>
